name: Safety module checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check app.js && node --check cloud.js && node --check safety.js && node --check workspace.js && node --check workspace-core.js
      - run: node --check operaciones/client-scope.js && node --check operaciones/host.js && node --check operaciones/workers-core.js && node --check operaciones/boot.mjs
